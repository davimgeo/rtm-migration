# ------------------------- General -------------------------
[General]
debug = false

# --------------------------- RTM ---------------------------
[RTM]
save = false

# ------------------------ Modeling -------------------------
[Modeling]
dh = 10.0

[Modeling.Cerjan]
nb = 100
factor = 0.0015

# ----------------------- Seismogram ------------------------
[Seismogram]
mode = "generate" # Keys: generate/load

[Seismogram.load]
path = ""

[Seismogram.parameters]
nt = 8001
dt = 0.0005

[Seismogram.plot]
perc = 95

# -------------------------- Model --------------------------
[Model]
mode = "create" # Keys: create/load

[Model.load]
path = "data/input/models/"

[Model.create]
nx = 200
nz = 100
interfaces = [50]
layerValues = [1500, 2000]

# ------------------------- Geometry ------------------------
[Geometry]
mode = "load" # Keys: create/load

[Geometry.load]
receivers = "data/input/geometry/receivers.txt"
sources = "data/input/geometry/sources.txt"

[Geometry.create]
offset = 5
receiversDepth = 0

# ------------------------- Wavelet -------------------------
[Wavelet]
fmax = 30.0
tlag = 0.15

# ------------------------ Snapshots ------------------------
[Snapshots]
numNyquist = false
number = 251